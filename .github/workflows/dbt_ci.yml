name: dbt CI

on:
  push:
    branches:
      - master
    paths:
      - 'dbt/**'
  pull_request:
    paths:
      - 'dbt/**'

env:
  PROJECT_ID: analytics-9t5-prod
  REGION: europe-west1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dbt-ci:
    name: dbt Compile and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/549131392640/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: dbt-ci-sa@analytics-9t5-prod.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install dbt-bigquery==1.8.0

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          analytics:
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: analytics-9t5-prod
                dataset: analytics
                location: europe-west1
                threads: 4
                timeout_seconds: 300
            target: dev
          EOF

      - name: dbt compile
        working-directory: dbt/analytics
        run: dbt compile --profile analytics

      - name: dbt test
        working-directory: dbt/analytics
        run: dbt test --profile analytics